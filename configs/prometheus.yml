# Prometheus configuration for DeployMate monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'deploymate'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: '/metrics'
    scheme: 'http'
    
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']