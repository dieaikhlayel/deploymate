# Alert configuration
alerts:
  slack:
    enabled: true
    webhook_url: ${SLACK_WEBHOOK_URL}
    channel: "#deployments"
    username: "DeployMate"
    icon_emoji: ":rocket:"
    
  email:
    enabled: false
    smtp_host: ${SMTP_HOST}
    smtp_port: 587
    smtp_username: ${SMTP_USERNAME}
    smtp_password: ${SMTP_PASSWORD}
    from_address: "deploymate@yourcompany.com"
    recipients:
      - "devops@yourcompany.com"
      - "team-lead@yourcompany.com"
      
  notification_rules:
    on_deployment_start:
      - slack
    on_deployment_success:
      - slack
    on_deployment_failure:
      - slack
      - email
    on_health_check_failure:
      - slack
      - email
    on_rollback:
      - slack
      - email