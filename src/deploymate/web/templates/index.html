<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeployMate - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card .value {
            color: #667eea;
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .server-item, .deployment-item {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background: #f8f9fa;
            transition: background 0.3s ease;
        }
        
        .server-item:hover, .deployment-item:hover {
            background: #e9ecef;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .status-healthy {
            background: #28a745;
        }
        
        .status-warning {
            background: #ffc107;
        }
        
        .status-critical {
            background: #dc3545;
        }
        
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
            text-decoration: none;
        }
        
        .btn:hover {
            background: #5a67d8;
        }
        
        .btn-danger {
            background: #dc3545;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 DeployMate</h1>
            <p>DevOps Automation Dashboard</p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be loaded here -->
        </div>
        
        <div class="content-grid">
            <div class="panel">
                <h2>Recent Deployments</h2>
                <div id="deploymentsList">
                    <!-- Deployments will be loaded here -->
                </div>
            </div>
            
            <div class="panel">
                <h2>System Alerts</h2>
                <div id="alertsList">
                    <!-- Alerts will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Load dashboard data
        async function loadDashboard() {
            try {
                const response = await fetch('/api/summary');
                const data = await response.json();
                
                // Update stats
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <h3>Servers</h3>
                        <div class="value">${data.server_count}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Deployments</h3>
                        <div class="value">${data.deployment_count}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Active Alerts</h3>
                        <div class="value">${data.alert_count}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Monitoring</h3>
                        <div class="value">${data.monitoring_active ? 'Active' : 'Inactive'}</div>
                    </div>
                `;
                
                // Update deployments list
                const deploymentsList = document.getElementById('deploymentsList');
                if (data.recent_deployments.length > 0) {
                    deploymentsList.innerHTML = data.recent_deployments.map(d => `
                        <div class="deployment-item">
                            <strong>${d.deployment_name}</strong> - ${d.server_name}
                            <br>
                            <small>${d.current_version || 'N/A'} | ${d.success ? 'Success' : 'Failed'}</small>
                        </div>
                    `).join('');
                } else {
                    deploymentsList.innerHTML = '<p>No recent deployments</p>';
                }
                
                // Update alerts list
                const alertsList = document.getElementById('alertsList');
                if (data.alerts.length > 0) {
                    alertsList.innerHTML = data.alerts.map(a => `
                        <div class="server-item">
                            <span class="status-indicator status-${a.type.includes('failed') ? 'critical' : 'warning'}"></span>
                            <strong>${a.server}</strong> - ${a.type}
                            <br>
                            <small>Value: ${a.value} (Threshold: ${a.threshold})</small>
                        </div>
                    `).join('');
                } else {
                    alertsList.innerHTML = '<p>No active alerts</p>';
                }
            } catch (error) {
                console.error('Failed to load dashboard:', error);
            }
        }
        
        // Load dashboard on page load
        loadDashboard();
        
        // Refresh every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
